# lint -> tests -> Docker build + smoke test -> publish image to GitHub Container Registry.
# Each job `needs` the previous one, so a lint error or a single failing test
# stops the pipeline and nothing is deployed. Deploy runs only on pushes to main.
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff==0.14.3
      - run: ruff check --output-format=github .

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -v

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t corn-classifier:ci .
      - name: Smoke test the container
        run: |
          docker run -d --name app -p 8501:8501 -p 8000:8000 corn-classifier:ci
          for i in $(seq 1 90); do curl -sf localhost:8000/health && break; sleep 2; done
          curl -sf localhost:8000/health | grep -q '"model_loaded":true'
          curl -sf -F file=@docs/examples/rust_1.jpg localhost:8000/predict | tee /dev/stderr | grep -q '"label":"Common rust"'
          test "$(curl -s -o /dev/null -w '%{http_code}' -F file=@README.md localhost:8000/predict)" = 400
          for i in $(seq 1 30); do curl -sf localhost:8501/_stcore/health && break; sleep 2; done
          curl -sf localhost:8501/_stcore/health
      - name: Container logs
        if: always()
        run: docker logs app || true

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ghcr.io image (tags latest + commit sha)
        run: |
          IMAGE=ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          SOURCE=https://github.com/${{ github.repository }}
          docker build -t "$IMAGE:latest" -t "$IMAGE:${GITHUB_SHA::7}" --label "org.opencontainers.image.source=$SOURCE" .
          docker push --all-tags "$IMAGE"
          echo "Published $IMAGE:latest and $IMAGE:${GITHUB_SHA::7}" >> "$GITHUB_STEP_SUMMARY"
